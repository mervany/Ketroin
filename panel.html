<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kestrion Operatör Paneli</title>
<style>
  /* Operasyon ekranı — tek tema, bilinçli olarak koyu:
     kamera izleme karanlık odada yapılır, açık tema göz yakar. */
  :root { color-scheme: dark; --ink: #0B1117; }
  html, body { height: 100%; margin: 0; background: var(--ink); }
  #root { height: 100%; }
  * { -webkit-tap-highlight-color: transparent; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const { useState, useEffect, useRef } = React;
/* =====================================================================
   KESTRION — operatör paneli
   Demo verisiyle çalışır. Gerçek API'ye bağlamak için aşağıdaki
   API_BASE'i doldur ve useDemo=false yap (dosya sonundaki nota bak).
   ===================================================================== */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

.k-root {
  /* Operasyon ekranı: koyu çelik zemin, teal kurumsal vurgu.
     Kehribar (--signal) yalnızca durum bildirir, süs olarak kullanılmaz. */
  --ink: #0B1117;
  --panel: #121B23;
  --panel-2: #17222B;
  --line: #26343F;
  --steel: #869BAA;
  --paper: #E3EAEF;
  --hi: #58B6C2;
  --hi-soft: #10323A;
  --signal: #E2A62E;
  --alarm: #E4694A;
  --ok: #5FA684;
  --font: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --display: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;

  background: var(--ink);
  color: var(--paper);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100%;
  padding-bottom: 76px;
}
.k-root * { box-sizing: border-box; }
.k-root button { font-family: inherit; cursor: pointer; }
.k-root button:focus-visible,
.k-root input:focus-visible,
.k-root textarea:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }

/* --- üst çubuk --- */
.k-top {
  position: sticky; top: 0; z-index: 20;
  background: var(--ink);
  border-bottom: 1px solid var(--line);
  padding: 14px 18px 12px;
  display: flex; align-items: baseline; justify-content: space-between;
}
.k-brand {
  font-family: var(--display); font-weight: 600; font-size: 19px;
  letter-spacing: 0.14em; margin: 0; white-space: nowrap;
}
.k-brand span { color: var(--hi); }
.k-org { color: var(--steel); font-size: 13px; }

/* --- durum şeridi: hi-vis bant --- */
.k-strip {
  display: flex; gap: 1px; background: var(--line);
  border-top: 3px solid var(--hi);
}
.k-stat {
  flex: 1; background: var(--panel); padding: 12px 10px; text-align: center;
}
.k-stat b {
  display: block; font-family: var(--display); font-size: 26px;
  font-weight: 600; line-height: 1;
}
.k-stat small { color: var(--steel); font-size: 12px; }
.k-stat.alarm b { color: var(--alarm); }
.k-stat.hi b { color: var(--hi); }

/* --- bölümler --- */
.k-body { padding: 18px; }
.k-h2 {
  font-family: var(--display); font-weight: 600; font-size: 19px;
  margin: 0 0 4px; letter-spacing: 0.02em;
}
.k-sub { color: var(--steel); font-size: 13px; margin: 0 0 14px; }

.k-floor {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 3px; padding: 8px 4px 4px; margin-bottom: 8px;
}
.k-legend {
  display: flex; align-items: center; gap: 8px;
  color: var(--steel); font-size: 12px; padding: 0 10px 6px;
}
.k-ramp {
  flex: 1; height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, #2C3A47, #4E7A93, #E2A62E, #E0452F);
}

/* --- kamera listesi --- */
.k-cam {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--panel);
  border-left: 3px solid var(--line); margin-bottom: 6px;
}
.k-cam.online { border-left-color: var(--ok); }
.k-cam.error  { border-left-color: var(--alarm); }
.k-cam-name { font-weight: 500; }
.k-cam-meta { color: var(--steel); font-size: 12.5px; }
.k-mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.k-cam-right { margin-left: auto; text-align: right; font-size: 12.5px; }
.k-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.k-dot.online { background: var(--ok); }
.k-dot.error  { background: var(--alarm); }

/* --- olaylar --- */
.k-ev {
  display: flex; gap: 12px; padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.k-ev-time {
  font-family: var(--display); font-size: 17px; font-weight: 600;
  color: var(--steel); min-width: 46px;
}
.k-ev-body { flex: 1; }
.k-ev-cam { color: var(--steel); font-size: 12.5px; margin-top: 2px; }
.k-sev {
  display: inline-block; width: 4px; align-self: stretch;
  background: var(--steel); border-radius: 2px;
}
.k-sev.s2 { background: #7E8FA0; }
.k-sev.s3 { background: var(--signal); }
.k-sev.s4 { background: var(--alarm); }

.k-chain {
  background: var(--panel); border: 1px solid var(--line);
  border-left: 3px solid var(--hi);
  padding: 12px 14px; margin-bottom: 16px;
}
.k-chain-path {
  font-family: var(--display); font-size: 15.5px;
  color: var(--paper); line-height: 1.7; word-spacing: 2px;
}
.k-chain-path em { color: var(--hi); font-style: normal; }

/* --- görevler & raporlar --- */
.k-task {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line);
  padding: 13px 14px; margin-bottom: 6px;
}
.k-clock {
  font-family: var(--display); font-size: 21px; font-weight: 600;
  color: var(--hi); min-width: 52px;
}
.k-task-off .k-clock { color: var(--steel); }
.k-task-off { opacity: 0.55; }

.k-switch {
  margin-left: auto; width: 40px; height: 22px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--panel-2);
  position: relative; padding: 0; flex-shrink: 0;
}
.k-switch i {
  position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
  border-radius: 50%; background: var(--steel); transition: all .18s;
}
.k-switch.on { background: #3B4A38; border-color: var(--ok); }
.k-switch.on i { left: 20px; background: var(--ok); }

.k-report {
  display: block; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 0; padding: 13px 14px; margin-bottom: 6px; color: inherit;
}
.k-report:hover { border-color: var(--steel); }
.k-report-t { font-weight: 500; }
.k-report-m { color: var(--steel); font-size: 12.5px; margin-top: 2px; }

.k-doc { background: var(--panel); border: 1px solid var(--line); padding: 18px 16px; }
.k-doc h1 { font-family: var(--display); font-size: 22px; margin: 0 0 2px; font-weight: 700; }
.k-doc h2 {
  font-family: var(--display); font-size: 16px; font-weight: 600;
  margin: 20px 0 6px; color: var(--hi); letter-spacing: 0.02em;
}
.k-doc p, .k-doc li { font-size: 14.5px; }
.k-doc ul { margin: 0; padding-left: 18px; }
.k-doc .k-meta { color: var(--steel); font-size: 13px; margin-bottom: 4px; }

/* --- sohbet --- */
.k-msg { max-width: 88%; padding: 11px 13px; margin-bottom: 10px; font-size: 14.5px; }
.k-msg.user { margin-left: auto; background: var(--panel-2); }
.k-msg.ai { background: var(--panel); border-left: 3px solid var(--hi); }
.k-msg.file {
  margin-left: auto; background: transparent; border: 1px dashed var(--steel);
  color: var(--steel); font-size: 13px;
}
.k-compose {
  display: flex; gap: 8px; align-items: flex-end;
  border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px;
}
.k-input {
  flex: 1; background: var(--panel); border: 1px solid var(--line);
  color: var(--paper); padding: 11px 12px; font-size: 15px; resize: none;
  font-family: inherit;
}
.k-send {
  background: var(--hi); color: var(--ink); border: 0;
  padding: 11px 16px; font-weight: 600; font-size: 15px;
}
.k-send:disabled { opacity: .4; }
.k-clip {
  background: var(--panel); color: var(--steel);
  border: 1px solid var(--line); padding: 11px 13px; font-size: 15px;
}

/* --- ekip --- */
.k-slot {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line);
  padding: 13px 14px; margin-bottom: 6px;
}
.k-slot.empty {
  background: transparent; border-style: dashed; color: var(--steel);
  justify-content: center; font-size: 14px;
}
.k-av {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--panel-2); color: var(--hi);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 600; font-size: 16px;
}
.k-role { margin-left: auto; color: var(--steel); font-size: 12.5px; }

/* --- alt gezinme --- */
.k-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; background: var(--panel);
  border-top: 1px solid var(--line);
}
.k-nav button {
  flex: 1; background: none; border: 0; color: var(--steel);
  padding: 10px 2px 12px; font-size: 11.5px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  border-top: 2px solid transparent; margin-top: -1px;
}
.k-nav button.on { color: var(--paper); border-top-color: var(--hi); }
.k-nav svg { width: 20px; height: 20px; }

.k-badge {
  display: inline-block; background: var(--alarm); color: #fff;
  font-size: 11px; font-weight: 600; padding: 1px 6px; margin-left: 6px;
}

/* --- giriş ekranı --- */
.k-auth {
  position: relative; min-height: 100vh; display: flex; flex-direction: column;
  overflow: hidden;
}
.k-auth-bg { position: absolute; inset: 0; opacity: .5; }
.k-auth-veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(15,21,27,.35) 0%, rgba(15,21,27,.92) 62%, #0F151B 100%);
}
.k-auth-in {
  position: relative; margin-top: auto; padding: 26px 22px 34px;
}
.k-auth h1 {
  font-family: var(--display); font-weight: 700; font-size: 44px;
  letter-spacing: 0.04em; margin: 0 0 6px; line-height: 1;
}
.k-auth h1 span { color: var(--hi); }
.k-auth-line {
  color: var(--steel); font-size: 15px; margin: 0 0 26px; max-width: 30ch;
}
.k-auth-rule { height: 3px; background: var(--hi); width: 46px; margin-bottom: 22px; }
.k-auth .k-field { margin-bottom: 12px; }
.k-alt {
  background: none; border: 0; color: var(--steel); font-size: 13.5px;
  padding: 14px 0 0; width: 100%;
}
.k-alt b { color: var(--hi); font-weight: 500; }

/* --- 3D sahne --- */
.k-scene { position: relative; height: 320px; touch-action: none; cursor: grab; }
.k-scene canvas { display: block; }
.k-scene-range {
  position: absolute; top: 8px; left: 8px; display: flex; gap: 4px;
}
.k-mini {
  background: rgba(23,32,41,.88); border: 1px solid var(--line);
  color: var(--steel); padding: 5px 9px; font-size: 12px; height: 30px;
}
.k-mini.on { color: var(--hi); border-color: var(--hi); }
.k-card {
  position: absolute; left: 8px; right: 8px; bottom: 8px;
  background: rgba(23,32,41,.95); border: 1px solid var(--line);
  border-left: 3px solid var(--hi); padding: 10px 12px;
  display: flex; align-items: center; gap: 12px;
}
.k-card.dead { border-left-color: var(--alarm); }
.k-card-name { font-weight: 500; font-size: 14.5px; }
.k-card-meta { color: var(--steel); font-size: 12.5px; }
.k-card-num {
  margin-left: auto; text-align: right;
  font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1;
}
.k-card-num small {
  display: block; font-family: var(--font); font-size: 11px;
  color: var(--steel); font-weight: 400;
}
.k-card-x {
  background: none; border: 0; color: var(--steel);
  font-size: 18px; padding: 0 0 0 6px;
}
.k-scene:active { cursor: grabbing; }
.k-scene-tip {
  position: absolute; bottom: 8px; left: 12px;
  color: var(--steel); font-size: 11.5px; pointer-events: none;
}
.k-scene-tools {
  position: absolute; top: 8px; right: 8px; display: flex; gap: 4px;
}
.k-tool {
  background: rgba(23,32,41,.85); border: 1px solid var(--line);
  color: var(--steel); width: 30px; height: 30px; font-size: 15px; padding: 0;
}
.k-tool.on { color: var(--hi); border-color: var(--hi); }

/* --- yükleme --- */
.k-upload { display: none; }
.k-progress {
  height: 3px; background: var(--line); margin-top: 8px; overflow: hidden;
}
.k-progress i { display: block; height: 100%; background: var(--hi); transition: width .3s; }

/* --- bina 3D --- */
.k-scene-tall { height: 360px; }
.k-lift {
  position: absolute; top: 8px; left: 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.k-lift button {
  width: 40px; height: 34px; padding: 0;
  background: rgba(23,32,41,.9); border: 1px solid var(--line);
  color: var(--steel); font-family: var(--display); font-weight: 600; font-size: 16px;
}
.k-lift button.on { background: var(--hi); border-color: var(--hi); color: var(--ink); }
.k-lift button.all { font-family: var(--font); font-weight: 500; font-size: 11px; margin-top: 4px; }
.k-scene-bottom { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 4px; }

/* --- oynatıcı --- */
.k-player { background: #000; }
.k-player canvas { display: block; width: 100%; height: auto; cursor: pointer; }
.k-bigplay {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 54px; height: 54px; border-radius: 50%;
  background: rgba(15,21,27,.72); border: 2px solid var(--paper);
  color: var(--paper); font-size: 20px; padding: 0 0 0 4px;
}
.k-ended {
  position: absolute; inset: 0; background: rgba(15,21,27,.72);
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.k-pctl {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px; background: var(--panel); border-top: 1px solid var(--line);
}
.k-pbtn {
  background: transparent; border: 1px solid var(--line); color: var(--paper);
  height: 32px; min-width: 34px; padding: 0 9px; font-size: 13px; flex-shrink: 0;
}
.k-pbtn.hi { background: var(--hi); color: var(--ink); border-color: var(--hi); font-weight: 600; }
.k-pbtn.on { color: var(--steel); border-style: dashed; }
.k-track { position: relative; flex: 1; height: 30px; cursor: pointer; touch-action: none; }
.k-track-bar { position: absolute; left: 0; right: 0; top: 13px; height: 4px; background: var(--line); }
.k-track-fill { position: absolute; left: 0; top: 13px; height: 4px; background: var(--signal); }
.k-track-mark { position: absolute; top: 7px; width: 3px; height: 16px; background: var(--alarm); margin-left: -1px; }
.k-track-knob {
  position: absolute; top: 8px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--paper); margin-left: -7px; box-shadow: 0 0 0 3px rgba(15,21,27,.6);
}
.k-ptime { font-family: var(--display); font-size: 14px; color: var(--steel); min-width: 58px; text-align: right; }
.k-more {
  display: block; width: 100%; text-align: left;
  background: var(--panel-2); border: 0; border-top: 1px solid var(--line);
  color: var(--signal); padding: 11px 12px; font-size: 14px; font-weight: 500;
}

/* --- olay kartı --- */
.k-clipcard { background: var(--panel); border: 1px solid var(--line); margin-bottom: 16px; }
.k-clipcard.s4 { border-top: 3px solid var(--alarm); }
.k-clipcard.s3 { border-top: 3px solid var(--signal); }
.k-clipcard.muted { opacity: .55; }
.k-clip-head { display: flex; align-items: baseline; gap: 10px; padding: 11px 12px 9px; }
.k-clip-time { font-family: var(--display); font-size: 23px; font-weight: 600; line-height: 1; }
.k-tag { font-size: 11.5px; padding: 2px 7px; border: 1px solid; }
.k-tag.s4 { color: var(--alarm); border-color: var(--alarm); }
.k-tag.s3 { color: var(--signal); border-color: var(--signal); }
.k-clip-body { padding: 11px 12px 0; font-size: 14.5px; }
.k-clip-foot { display: flex; gap: 8px; padding: 10px 12px 12px; }

/* --- bina yapısı listesi --- */
.k-bld { background: var(--panel); border: 1px solid var(--line); margin-bottom: 6px; }
.k-bld summary {
  list-style: none; cursor: pointer; padding: 11px 14px;
  display: flex; align-items: center; gap: 10px;
}
.k-bld summary::-webkit-details-marker { display: none; }
.k-bld-lv { font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--hi); width: 22px; }
.k-room {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; border-top: 1px solid var(--line); font-size: 14px;
}
.k-conf { margin-left: auto; font-size: 12px; color: var(--steel); text-align: right; }
.k-conf.low { color: var(--signal); }
.k-ask {
  background: var(--panel-2); border-left: 3px solid var(--hi);
  padding: 12px 14px; font-size: 14px; margin: 4px 0 14px;
}
.k-ask p { margin: 0 0 10px; }
.k-spin {
  display: inline-block; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--hi);
  animation: kspin .8s linear infinite; vertical-align: -2px; margin-right: 8px;
}
@keyframes kspin { to { transform: rotate(360deg); } }

/* --- deneme uyarısı --- */
.k-trial {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: var(--signal); color: #1A1405; border: 0;
  padding: 9px 18px; font-size: 13.5px; font-weight: 500; text-align: left;
}
.k-trial.alarm { background: var(--alarm); color: #fff; }
.k-trial b { font-family: var(--display); font-size: 16px; font-weight: 700; }
.k-trial span:last-child { margin-left: auto; font-weight: 600; }

/* --- hesap alt sekmeleri --- */
.k-seg { display: flex; gap: 2px; background: var(--line); padding: 2px; margin-bottom: 18px; }
.k-seg button {
  flex: 1; background: var(--panel); border: 0; color: var(--steel);
  padding: 10px 4px; font-size: 14px;
}
.k-seg button.on { background: var(--panel-2); color: var(--paper); box-shadow: inset 0 -2px 0 var(--hi); }

/* --- abonelik --- */
.k-sub-card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--hi); padding: 16px; margin-bottom: 16px; }
.k-sub-card.alarm { border-top-color: var(--alarm); }
.k-sub-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.k-sub-plan { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; }
.k-sub-line { color: var(--steel); font-size: 13.5px; margin-top: 8px; }
.k-meters { display: grid; gap: 10px; margin-top: 14px; }
.k-meter-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--steel); }
.k-meter-row b { color: var(--paper); font-weight: 500; }
.k-bar { height: 5px; background: var(--line); margin-top: 4px; }
.k-bar i { display: block; height: 100%; background: var(--steel); }
.k-bar i.hi { background: var(--signal); } .k-bar i.alarm { background: var(--alarm); }

.k-toggle { display: inline-flex; background: var(--line); padding: 2px; gap: 2px; margin-bottom: 12px; }
.k-toggle button { background: var(--panel); border: 0; color: var(--steel); padding: 8px 14px; font-size: 13.5px; }
.k-toggle button.on { background: var(--panel-2); color: var(--paper); }
.k-toggle small { color: var(--ok); margin-left: 6px; }

.k-plan {
  background: var(--panel); border: 1px solid var(--line); padding: 15px; margin-bottom: 8px;
}
.k-plan.cur { border-color: var(--hi); }
.k-plan.off { opacity: .5; }
.k-plan-top { display: flex; align-items: baseline; gap: 8px; }
.k-plan-name { font-family: var(--display); font-size: 21px; font-weight: 600; }
.k-plan-price { margin-left: auto; font-family: var(--display); font-size: 22px; font-weight: 600; }
.k-plan-price small { font-family: var(--font); font-size: 12px; color: var(--steel); font-weight: 400; }
.k-plan ul { margin: 8px 0 12px; padding-left: 18px; color: #C3CFD9; font-size: 13.5px; }
